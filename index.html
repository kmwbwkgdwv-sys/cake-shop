<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ケーキ屋さんシミュレーター</title>
  <meta name="description" content="最大4人で1つのケーキ屋さんを共同経営する、一人称視点のケーキ屋さん経営シミュレーション（ブラウザで遊べます）">
  <meta name="theme-color" content="#14110F">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 30h48v22a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z' fill='%23D9B26F' stroke='%232A211C' stroke-width='4'/%3E%3Cpath d='M8 30c0-10 48-10 48 0v8H8z' fill='%23F6F1E8' stroke='%232A211C' stroke-width='4'/%3E%3Ccircle cx='32' cy='16' r='9' fill='%23C8102E' stroke='%232A211C' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261109">
</head>
<body>
  <div id="app">
    <!-- 起動 -->
    <section id="scr-boot" class="screen on" aria-busy="true">
      <div class="boot-cake" id="boot-cake"></div>
      <div class="boot-text">準備中…</div>
    </section>

    <!-- タイトル -->
    <section id="scr-title" class="screen">
      <div class="title-sky" aria-hidden="true"></div>
      <div class="title-wrap">
        <header class="logo">
          <div class="logo-cake" id="logo-cake"></div>
          <h1>ケーキ屋さん<span>SIMULATOR</span></h1>
          <span class="ribbon">最大4人で共同経営</span>
        </header>
        <div class="title-me panel">
          <div class="av" id="me-av"></div>
          <div class="meta">
            <div class="name" id="me-name"></div>
            <span class="chip sync-chip" id="me-sync"></span>
          </div>
          <button class="icon-btn" id="me-edit" aria-label="きせかえ"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-.5 2-2 3-4 3s-3.5-1-4-3z"/></svg></button>
        </div>
        <div class="title-menu">
          <button class="btn big pink" id="btn-continue" hidden>つづきから <small></small></button>
          <button class="btn big yellow" id="btn-new">お店をつくる <small>ひとりでも・みんなでも</small></button>
          <button class="btn big mint" id="btn-join">お店に参加 <small>招待コードを入力</small></button>
        </div>
        <div class="title-sub">
          <button class="btn" id="btn-shops"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>マイショップ</button>
          <button class="btn" id="btn-skin"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-.5 2-2 3-4 3s-3.5-1-4-3z"/></svg>きせかえ</button>
          <button class="btn" id="btn-transfer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>引き継ぎ</button>
          <button class="btn" id="btn-rank"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 21h7M10 17h4"/></svg>ランキング</button>
          <button class="btn" id="btn-settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg>設定</button>
        </div>
        <p class="title-foot" id="title-foot"></p>
      </div>
    </section>

    <!-- ゲーム -->
    <section id="scr-game" class="screen"></section>
  </div>

  <div id="sheet" hidden></div>
  <div id="mg" hidden></div>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fxlayer" aria-hidden="true"></div>

  <!-- Firebase（compat 版） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=20261109"></script>
  <!-- ゲーム本体 -->
  <script src="js/data.js?v=20261109"></script>
  <script src="js/sim.js?v=20261109"></script>
  <script src="js/plan.js?v=20261109"></script>
  <script src="js/kitchen.js?v=20261109"></script>
  <script src="js/art.js?v=20261109"></script>
  <script src="js/net.js?v=20261109"></script>
  <script src="js/fx.js?v=20261109"></script>
  <script src="js/gl.js?v=20261109"></script>
  <script src="js/models.js?v=20261109"></script>
  <script src="js/world.js?v=20261109"></script>
  <script src="js/ui.js?v=20261109"></script>
  <script src="js/rank.js?v=20261109"></script>
  <script src="js/game.js?v=20261109"></script>
  <script>
    try { document.getElementById('boot-cake').innerHTML = CS.models.img(CS.models.thumb.cake(CS.data.RECIPES.short), 'thumb');
      document.getElementById('logo-cake').innerHTML = CS.models.img(CS.models.thumb.cake(CS.data.RECIPES.choco_berry, 5), 'thumb'); } catch (e) { /* WebGL なし */ }
  </script>
  <script src="js/main.js?v=20261109"></script>
</body>
</html>
